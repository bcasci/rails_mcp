name: Ruby

on:
  push:
    branches:
      - main

  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    name: Ruby ${{ matrix.ruby }} / ${{ matrix.gemfile }}
    # Job-level so ruby/setup-ruby's bundler-cache installs the SAME per-Rails gemfile
    # every step uses. Step-scoped BUNDLE_GEMFILE let setup-ruby cache the default
    # Gemfile, then `bundle exec rake` ran a different gemfile and failed to resolve.
    env:
      BUNDLE_GEMFILE: gemfiles/${{ matrix.gemfile }}
    strategy:
      fail-fast: false
      matrix:
        ruby:
          - '3.2'
          - '3.3'
          - '3.4'
        gemfile:
          - rails_7.1.gemfile
          - rails_7.2.gemfile
          - rails_8.0.gemfile

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - name: Run the default task
        run: bundle exec rake

      - name: Each test file passes in isolation
        run: |
          fail=0
          while IFS= read -r file; do
            echo "== $file =="
            if ! bundle exec ruby -Itest "$file"; then
              echo "ISOLATION FAILURE: $file failed when run alone"
              fail=1
            fi
          done < <(find test -name '*_test.rb' | sort)
          exit $fail

  # Prove the packaged gem (the spec.files allowlist) builds, installs off-bundle,
  # and require-loads. The pure-Ruby analog of litestream's build (package job,
  # gem-install.yml:32) + install/run (vanilla-install, :50-51); require replaces
  # litestream's binary smoke. Single Ruby / single Gemfile because the .gem is one
  # matrix-independent artifact (spec R3), so it is not a leg of the build matrix.
  gem-smoke:
    runs-on: ubuntu-latest
    name: Gem build + install + load smoke
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
      - name: Build, install off-bundle, and require the packaged gem
        run: |
          gem build rails_mcp.gemspec
          gem install --install-dir "$RUNNER_TEMP/gems" ./rails_mcp-*.gem
          GEM_HOME="$RUNNER_TEMP/gems" GEM_PATH="$RUNNER_TEMP/gems" ruby -e 'require "rails_mcp"'
